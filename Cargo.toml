[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# The command line's errors, each saying what to do about it; in `pk-cli` only.
anyhow = "1"
# The command line's arguments, parsed from structs that derive them; in `pk-cli` only.
clap = { version = "4", features = ["derive"] }
rand_chacha = "0.10"
# Threads for the postflop walks, which run a chance node's children in parallel.
rayon = "1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` reads every decimal as the nearest f64, so that a number written with
# enough digits reads back exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
# Peak resident memory on Windows, for the postflop resource log; Linux reads /proc instead.
windows-sys = "0.61"
# The sections of a postflop solution file, each one zstd frame with its checksum.
zstd = { version = "0.14", default-features = false }

criterion = "0.8"
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

# Tests enumerate boards and run solves, so they are built optimized.
# Debug assertions and overflow checks stay on, inherited from dev.
[profile.test]
opt-level = 3
