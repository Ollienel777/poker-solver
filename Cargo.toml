[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

# Tests enumerate boards and run solves, so they are built optimized.
# Debug assertions and overflow checks stay on, inherited from dev.
[profile.test]
opt-level = 3
