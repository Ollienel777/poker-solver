<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solution files</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- A placeholder for the viewer's page (#93): it lists the folder's solution files from
     /api/files, to show that the server and its API are wired. -->
<h1>Solution files</h1>
<p id="folder">Loading the list...</p>
<pre id="files"></pre>
<script>
  fetch("/api/files")
    .then((response) => response.json())
    .then((list) => {
      document.getElementById("folder").textContent =
        list.files.length + " solution files in " + list.folder;
      document.getElementById("files").textContent = list.files
        .map((file) =>
          file.error
            ? file.name + ": " + file.error
            : file.name + "  " + file.spot.name + "  " + file.spot.board.join("") +
              "  held: " + file.streets.join(", "))
        .join("\n");
    })
    .catch((error) => {
      document.getElementById("folder").textContent = "Could not list the files: " + error;
    });
</script>
</body>
</html>
