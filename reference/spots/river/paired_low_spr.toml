name = "paired_low_spr"
description = "Illustrative ranges, written for this fixture: a 3-bet pot on a paired board. BB (OOP) 3-bet BTN (IP), bet the flop Qc Qd 8h and the turn 5s, and was called twice; on the river 3c only 30bb is left behind a 40bb pot (SPR 0.75), so all-in is the natural bet. Narrow ranges: OOP holds trips, overpairs and missed aces; IP holds trips, full houses and underpairs. A half-pot bet or all-in, and facing a bet only an all-in raise. 5% rake, cap 3bb, which every called bet reaches."
