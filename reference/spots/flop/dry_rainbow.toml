format = 1
name = "dry_rainbow"
description = "Illustrative ranges, copied on 2026-11-24 from reference/ranges/a/BTN_vs_BB_SRP.toml, the repository's own made-up ranges, which were not taken from any solver, chart, site or book. BTN (IP) opened to 2.5bb, the SB folded and BB (OOP) called, so 97.5bb is left behind a 5.5bb pot on the flop Kd 7c 2h: dry and rainbow, with no flush draw and no straight draw. One bet of half the pot on each street and no raises: the plain 100bb single-raised-pot flop solve of the M4 gate. Rake-free."
